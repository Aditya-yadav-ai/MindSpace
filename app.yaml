# MindSpace Deployment Config (Requirement #11)
#
# Deploy options:
#   1. Google Cloud Run (recommended for serverless)
#   2. Railway (simplest for small projects)
#   3. Render (free tier available)
#
# This file contains the config for Google Cloud Run.

service: mas-ecommerce-api
runtime: python312
instance_class: F2

env_variables:
  PORT: "8000"
  GROQ_API_KEY: "set-in-cloud-console"
  PYTHONPATH: "/app"

# Health check
readiness_check:
  path: /health
  check_interval_sec: 10
  timeout_sec: 5

# Auto-scaling
automatic_scaling:
  min_instances: 0
  max_instances: 3
  target_cpu_utilization: 0.7
