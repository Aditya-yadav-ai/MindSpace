name: MindSpace CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, "stage-*"]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-extension:
    name: Frontend UI & Chrome MV3 Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify code style & linting
        run: npm run lint

      - name: Run Auth & session test suite
        run: npm run test:auth

      - name: Run PDF standard font test suite
        run: npm run test:pdf

      - name: Run Google Workspace adapter test suite
        run: npm run test:google

      - name: Build unpacked extension (dist-extension)
        run: npm run build:extension

      - name: Run headless Chrome extension tests
        run: npm run test:extension

      - name: Build TanStack Start SSR web application
        run: npm run build

      - name: Verify extension build artifacts
        run: |
          test -f dist-extension/manifest.json
          test -f dist-extension/extension-background.js
          test -f dist-extension/sidepanel.html
          test -f dist-extension/content-script.js
          test -d dist-extension/standard_fonts
          test -d dist-extension/cmaps
          test ! -f dist-extension/_headers

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-extension
          path: dist-extension/
          retention-days: 14

  backend-api:
    name: Python FastAPI & Multi-Agent Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt pytest pytest-asyncio pytest-subtests

      - name: Run database migrations check
        env:
          PYTHONPATH: apps/api
          MINDSPACE_ENV: test
        run: python -m scripts.db_admin migrate

      - name: Run Pytest test suite
        env:
          PYTHONPATH: apps/api
          MINDSPACE_ENV: test
        run: pytest apps/api/tests -v --tb=short -q

  security-audit:
    name: Dependency Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit check
        run: npm audit --audit-level=high || true

      - name: Check for unredacted secrets & conflict markers
        run: |
          ! grep -rnw . -e '<<<<<<<' -e '>>>>>>>' --exclude-dir={.git,node_modules,.venv,.venv312}
